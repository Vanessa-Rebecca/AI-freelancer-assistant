name: CI

on:
  push:
    branches: ['**']
  pull_request:

# A newer push to the same branch cancels the run in progress
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Read-only: CI never needs to change the repository
permissions:
  contents: read

jobs:
  check:
    name: Lint, typecheck and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      # Exact install from the lockfile; postinstall also runs `prisma generate`
      - run: npm ci

      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm run build -w @afa/web
